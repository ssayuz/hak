<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자막영상 다운로드</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#e8eaf0;--mut:#8b93a5;--acc:#4f8cff;--err:#ff6b6b;--ok:#3ecf8e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding:24px}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 28px}
  .icon{width:52px;height:52px;border-radius:14px;background:#22283a;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  h1{font-size:20px;margin:0 0 6px}
  .meta{color:var(--mut);font-size:13px;margin-bottom:24px}
  label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
  .row{display:flex;gap:8px}
  input{flex:1;min-width:0;background:#0f1115;border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:18px;letter-spacing:.3em;padding:12px 14px;outline:none}
  input:focus{border-color:var(--acc)}
  button{background:var(--acc);color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:600;padding:0 18px;cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.5;cursor:default}
  .full{width:100%;padding:14px;margin-top:16px}
  .msg{font-size:13px;margin-top:12px;min-height:18px}
  .err{color:var(--err)} .ok{color:var(--ok)}
  .bar{height:6px;background:#0f1115;border-radius:3px;overflow:hidden;margin-top:14px;display:none}
  .bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
  .hidden{display:none}
</style>
</head>
<body>
<main class="card">
  <div class="icon">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h1>자막영상_v3.mp4</h1>
  <div class="meta">MP4 · 72.9 MB · 2분 16초 · 암호로 보호됨</div>

  <form id="f">
    <label for="pw">비밀번호</label>
    <div class="row">
      <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
      <button id="go" type="submit">열기</button>
    </div>
  </form>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="msg" id="msg"></div>

  <section id="done" class="hidden">
    <button id="dl" class="full">다운로드</button>
  </section>
</main>
<script>
const META = {"salt":"9a8cb0accc04ec3be19980d337e22aaa","iv":"8c0bd1b8587a530c71f24052","iter":600000,"parts":["data/part0.bin","data/part1.bin","data/part2.bin","data/part3.bin","data/part4.bin"],"total":76471637};
const FILENAME = "자막영상_v3.mp4";
const $ = id => document.getElementById(id);
const hex = h => new Uint8Array(h.match(/../g).map(b => parseInt(b, 16)));
let cipher = null, blob = null;
const msg = (t, c) => { $("msg").textContent = t; $("msg").className = "msg " + (c || ""); };

async function fetchCipher() {
  if (cipher) return cipher;
  $("bar").style.display = "block";
  const buf = new Uint8Array(META.total); let off = 0;
  for (let i = 0; i < META.parts.length; i++) {
    msg(`파일 받는 중… (${i + 1}/${META.parts.length})`);
    const r = await fetch(META.parts[i]);
    if (!r.ok) throw new Error("fetch");
    const b = new Uint8Array(await r.arrayBuffer());
    buf.set(b, off); off += b.length;
    $("fill").style.width = (off / META.total * 100) + "%";
  }
  return (cipher = buf);
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("pw").value.trim();
  if (!pw) return msg("비밀번호를 입력하세요.", "err");
  $("go").disabled = true;
  try {
    const data = await fetchCipher();
    msg("확인 중…");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:hex(META.salt), iterations:META.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    let plain;
    try { plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:hex(META.iv)}, key, data); }
    catch { msg("비밀번호가 틀렸습니다.", "err"); $("go").disabled = false; $("pw").select(); return; }
    blob = new Blob([plain], {type:"video/mp4"});
    $("f").classList.add("hidden"); $("bar").style.display = "none";
    $("done").classList.remove("hidden");
    msg("잠금 해제됨", "ok");
  } catch (err) {
    msg("파일을 불러오지 못했습니다. 새로고침 후 다시 시도하세요.", "err");
    $("go").disabled = false;
  }
});

$("dl").addEventListener("click", () => {
  if (!blob) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = FILENAME;
  document.body.appendChild(a); a.click(); a.remove();
  msg("다운로드 시작됨", "ok");
});
</script>
</body>
</html>
